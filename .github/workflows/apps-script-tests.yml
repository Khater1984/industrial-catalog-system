name: Apps Script validation

on:
  push:
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-tests.yml"
  pull_request:
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script-tests.yml"

jobs:
  apps-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Apps Script bundle
        run: npm run build
      - name: Run Apps Script unit tests
        run: npm test
      - name: Check generated JavaScript syntax
        run: node --check < dist/Code.gs
