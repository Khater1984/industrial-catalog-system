name: Python worker validation

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-validation.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-validation.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"
      - name: Run worker tests
        run: pytest -q
      - name: Compile worker
        run: python -m compileall -q src
      - name: Run live Python-to-Apps-Script contract test
        run: node ../scripts/worker-contract.test.js
