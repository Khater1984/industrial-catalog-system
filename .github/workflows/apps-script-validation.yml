name: Apps Script validation

on:
  push:
    paths:
      - "apps-script/**"
      - "schema/**"
      - "ENUM_REGISTRY.md"
      - ".github/workflows/apps-script-validation.yml"
  pull_request:
    paths:
      - "apps-script/**"
      - "schema/**"
      - "ENUM_REGISTRY.md"
      - ".github/workflows/apps-script-validation.yml"

permissions:
  contents: read

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate schema and build Apps Script bundle
        run: npm run build
      - name: Run validation tests
        run: npm test
      - name: Check generated JavaScript syntax
        run: node --check < dist/Code.gs
