name: Worker and Apps Script integration

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: ["dev/**", "feat/**"]

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install worker and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile worker
        run: python -m compileall -q src
      - name: Run worker tests
        run: pytest -q
      - name: Build Cloud Run container
        run: docker build -t industrial-catalog-worker:test -f Dockerfile .

  apps-script-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Build Apps Script bundle
        run: npm run build

  cross-contract:
    runs-on: ubuntu-latest
    needs: [worker-tests, apps-script-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Worker and Apps Script contract
        run: python scripts/validate_worker_contract.py
