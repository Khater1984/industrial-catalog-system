name: Drive-backed catalog worker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Immutable Run_ID created by Apps Script
        required: true
        type: string
      job_file_id:
        description: Google Drive file ID for immutable job.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-worker-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  process-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        working-directory: worker
    env:
      RUN_ID: ${{ inputs.run_id }}
      JOB_FILE_ID: ${{ inputs.job_file_id }}
      GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
      CATALOG_WORKER_EXTRACT_IMAGES: "1"
      CATALOG_WORKER_OCR_LANGUAGES: "ara+eng"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install OCR engine and Arabic/English language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Verify OCR engine and language packs
        run: |
          tesseract --version
          tesseract --list-langs | grep -Fx ara
          tesseract --list-langs | grep -Fx eng
      - name: Install worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate required secrets
        run: |
          python - <<'PY'
          import json, os, sys
          raw = os.environ.get("GOOGLE_OAUTH_CREDENTIALS_JSON", "")
          if not raw:
              sys.exit("Missing GOOGLE_OAUTH_CREDENTIALS_JSON secret")
          try:
              value = json.loads(raw)
          except ValueError:
              sys.exit("GOOGLE_OAUTH_CREDENTIALS_JSON is not valid JSON")
          required = ("client_id", "client_secret", "refresh_token", "token_uri")
          missing = [key for key in required if not value.get(key)]
          if missing:
              sys.exit("OAuth secret is missing required fields: " + ", ".join(missing))
          PY
      - name: Run Drive-backed worker
        run: python -m catalog_worker.github_actions_cli --run-id "$RUN_ID" --job-file-id "$JOB_FILE_ID"
